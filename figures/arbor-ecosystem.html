Text, colors and links: edit the PROJECTS object in the script and the href on each node. -->
<div class="arbmap" id="arbmap">
<style>
.arbmap{position:relative;width:100%;max-width:1040px;margin:1.5rem auto;color:inherit;font-family:inherit;
--c-libarbor:#1e8a5f;--c-arbor:#2766b4;--c-shiny:#1597a6;--c-merger:#6b57c9;--c-cli:#c0477a;--c-studio:#d98a10}
.arbmap svg{display:block;width:100%;height:auto;overflow:visible}
.arbmap .zone{stroke-width:1.3;stroke-dasharray:3 5}
.arbmap .zone.zr{fill:var(--c-arbor);fill-opacity:.05;stroke:var(--c-arbor);stroke-opacity:.45}
.arbmap .zone.zs{fill:var(--c-studio);fill-opacity:.06;stroke:var(--c-studio);stroke-opacity:.5}
.arbmap .zone-label{font-size:13.5px;font-weight:600}
.arbmap .zone-label.zr{fill:var(--c-arbor)}
.arbmap .zone-label.zs{fill:var(--c-studio)}
.arbmap .edge{fill:none;stroke-width:2.2;opacity:.6;transition:opacity .15s,stroke-width .15s}
.arbmap .edge.from-libarbor{stroke:var(--c-libarbor)}
.arbmap .edge.from-arbor{stroke:var(--c-arbor)}
.arbmap .edge-label{font-size:12px;font-style:italic;fill:currentColor;opacity:.65;transition:opacity .15s}
.arbmap .node{cursor:pointer;outline:none;transition:opacity .15s}
.arbmap a.node,.arbmap a.node:hover,.arbmap a.node:focus,.arbmap a.node:visited,.arbmap a.node:active{color:inherit!important;text-decoration:none!important;border:0!important;box-shadow:none!important}
.arbmap a.node text{text-decoration:none!important}
.arbmap .node .bg{fill:var(--c);fill-opacity:.11;stroke:var(--c);stroke-width:2;transition:fill-opacity .15s,stroke-width .15s}
.arbmap .node.core .bg{stroke-width:2.8;fill-opacity:.16}
.arbmap .badge-bg{fill:var(--c)}
.arbmap .node .t{font-size:15px;font-weight:700;fill:currentColor}
.arbmap .node .s{font-size:12px;fill:currentColor;opacity:.75}
.arbmap .node .pill{fill:var(--c)}
.arbmap .node .pill-t{font-size:10.5px;font-weight:600;fill:#fff}
.arbmap .node.gui .bg{stroke-dasharray:8 4}
.arbmap .node:hover .bg,.arbmap .node:focus-visible .bg,.arbmap .node.on .bg{fill-opacity:.24;stroke-width:3.2}
.arbmap .node:focus-visible .bg{stroke:currentColor;stroke-dasharray:none}
.arbmap.dim .node:not(.on),.arbmap.dim .edge:not(.on),.arbmap.dim .edge-label:not(.on){opacity:.2}
.arbmap .edge.on{opacity:1;stroke-width:3.2}
.arbmap .legend text{font-size:12px;fill:currentColor;opacity:.7}
.arbmap .tip{position:absolute;z-index:20;width:320px;max-width:calc(100% - 12px);padding:12px 14px 10px 16px;border-radius:10px;
background:var(--bs-body-bg,#fff);color:var(--bs-body-color,#222);border:1px solid rgba(128,128,128,.4);border-left:5px solid var(--c,#888);
box-shadow:0 8px 26px rgba(0,0,0,.22);font-size:13.5px;line-height:1.45;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s}
.arbmap .tip.show{opacity:1;visibility:visible}
.arbmap .tip .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.arbmap .tip .hd svg{flex:none;width:34px;height:34px}
.arbmap .tip h4{margin:0;font-size:15.5px;font-weight:700;line-height:1.2}
.arbmap .tip .kind{font-size:12px;color:var(--c);font-weight:600}
.arbmap .tip p{margin:0 0 6px}
.arbmap .tip ul{margin:0 0 6px;padding-left:18px}
.arbmap .tip code{font-size:12px}
.arbmap .tip .status{display:inline-block;margin:0 0 6px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--c);color:#fff}
.arbmap .tip .go{margin:6px 0 0;font-size:12px;opacity:.7}
@media (max-width:640px){.arbmap .node .t{font-size:18px}.arbmap .node .s{font-size:14px}.arbmap .edge-label,.arbmap .zone-label{font-size:16px}}
@media (prefers-reduced-motion:reduce){.arbmap *{transition:none!important}}
</style>

<script>
(function(){
var root=document.getElementById('arbmap'); if(!root||root.dataset.ready) return; root.dataset.ready='1';
var tip=root.querySelector('.tip');
// ---- Edit tooltip text here (colors: --c-* variables in the style block) --
var PROJECTS={
libarbor:{name:'libarbor',kind:'C++ library, core engine',
body:'The workhorse behind everything else. Processes mobile laser scanning (MLS) forest point clouds from ground classification to individual QSM reconstruction.',
list:['Ground, wood/foliage and tree instance segmentation','Quantitative structure models (QSM) of whole plots','About 700 QSMs per minute on a laptop'],
note:'Open source, GPL-3.'},
arbor:{name:'arbor',kind:'R package',
body:'The R interface to libarbor. Runs the full pipeline from R, from raw scan to forest model, and lets you build custom workflows.',
list:['Install from r-lidar.r-universe.dev','Documented in the Arbor Book'],
note:'Open source, GPL-3.'},
shiny:{name:'arborShinyReport',kind:'R package, built on arbor',
body:'Turns an arbor result (segmented point cloud and forest model) into an interactive Shiny report for exploring a forest inventory.',
code:'shiny_report(qsf, las)'},
merger:{name:'arborInventoryMerger',kind:'R package, built on arbor',
body:'A specialized tool designed for a French lab. Merges ground-truth field inventories with arbor\u2019s tree segmentation output.'},
cli:{name:'Command-line tools',kind:'Terminal tools, shipped with the arbor R package',
body:'Run arbor from a terminal, without opening R.',
list:['arbor segment: ground, semantic and instance segmentation','arbor qsf: 3D model of the forest','arbor report: PDF summary of the scene'],
note:'Install with arbor::install_cmd_tools().'},
studio:{name:'ArborStudio',kind:'Desktop application with a graphical interface',status:'In development, not public yet',
body:'A classic installable GUI built on libarbor. Load files, click, and get outputs without writing code.',
list:['Interactive editing: reassign points to trees, refit QSMs','For practitioners working outside R and for researchers building validation datasets'],
note:'Release model (free or commercial) not decided. The core engine stays open source.'}
};
// -------------------------------------------------------------------------
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function html(p,badge){
var h='<div class="hd"><svg viewBox="-22 -22 44 44" aria-hidden="true">'+badge+'</svg><div><h4>'+esc(p.name)+'</h4><div class="kind">'+esc(p.kind)+'</div></div></div>';
if(p.status) h+='<div><span class="status">'+esc(p.status)+'</span></div>';
h+='<p>'+esc(p.body)+'</p>';
if(p.code) h+='<p><code>'+esc(p.code)+'</code></p>';
if(p.list) h+='<ul>'+p.list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
if(p.note) h+='<p>'+esc(p.note)+'</p>';
return h+'<p class="go">Click to open the project page</p>';
}
var nodes=[].slice.call(root.querySelectorAll('.node'));
var links=[].slice.call(root.querySelectorAll('[data-from]'));
// Compress a label slightly if the page font makes it wider than its box
function fitText(){
nodes.forEach(function(n){
var bg=n.querySelector('.bg');
[].forEach.call(n.querySelectorAll('.t,.s'),function(t){
t.removeAttribute('textLength');
var avail=(+bg.getAttribute('x'))+(+bg.getAttribute('width'))-12-(+t.getAttribute('x'));
var w=t.getComputedTextLength();
if(w>avail){t.setAttribute('textLength',avail);t.setAttribute('lengthAdjust','spacingAndGlyphs');}
});
});
}
try{fitText();}catch(e){}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){try{fitText();}catch(e){}});
function highlight(id){
root.classList.add('dim');
nodes.forEach(function(n){var d=n.dataset.id, rel=d===id;
links.forEach(function(e){if((e.dataset.from===id&&e.dataset.to===d)||(e.dataset.to===id&&e.dataset.from===d)) rel=true;});
n.classList.toggle('on',rel);});
links.forEach(function(e){e.classList.toggle('on',e.dataset.from===id||e.dataset.to===id);});
}
function clear(){root.classList.remove('dim');nodes.concat(links).forEach(function(e){e.classList.remove('on');});}
function show(n){
var p=PROJECTS[n.dataset.id];
tip.style.setProperty('--c',getComputedStyle(n).getPropertyValue('--c'));
tip.innerHTML=html(p,n.querySelector('.badge').innerHTML); tip.setAttribute('aria-hidden','false');
highlight(n.dataset.id);
var r=root.getBoundingClientRect(), b=n.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
var x=b.left-r.left+b.width/2-tw/2; x=Math.max(6,Math.min(x,r.width-tw-6));
var below=b.bottom-r.top+10, above=b.top-r.top-th-10;
var y=((b.top-r.top)<r.height*0.4||above<0)?below:above;
tip.style.left=x+'px'; tip.style.top=y+'px'; tip.classList.add('show');
}
function hide(){tip.classList.remove('show');tip.setAttribute('aria-hidden','true');clear();}
nodes.forEach(function(n){
var p=PROJECTS[n.dataset.id];
n.setAttribute('aria-label',p.name+': '+p.kind);
n.addEventListener('mouseenter',function(){show(n);});
n.addEventListener('mouseleave',hide);
n.addEventListener('focus',function(){show(n);});
n.addEventListener('blur',hide);
});
})();
</script>
